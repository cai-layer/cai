name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Check all Swift files are registered in the Xcode project
        run: |
          # A .swift file on disk that project.pbxproj doesn't reference never
          # builds and never runs; for a test file that means it silently
          # passes forever. Fails the build listing every unregistered file.
          # Matches by basename, so a file counts as registered if any
          # same-named file is referenced (fine today: no duplicate basenames).
          missing=0
          while IFS= read -r f; do
            base=$(basename "$f")
            if ! grep -qF "$base" Cai/Cai.xcodeproj/project.pbxproj; then
              echo "::error file=$f::$base exists on disk but is not referenced in project.pbxproj, so it never builds or runs. Add it to the Xcode project or delete it."
              missing=1
            fi
          done < <(find Cai/Cai Cai/CaiTests -name '*.swift')
          exit $missing

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Show environment
        run: |
          xcodebuild -version
          swift --version
          uname -m

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Cai/Cai.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve SPM dependencies
        working-directory: Cai
        run: xcodebuild -resolvePackageDependencies -scheme Cai

      - name: Build & run tests
        working-directory: Cai
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Cai \
            -configuration Debug \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: Cai/TestResults.xcresult
          retention-days: 7
